# One-click updates for a self-hosted MoltenRock Trade.
#
# Lives in YOUR copy of the app (the repository the "Deploy to Cloudflare" button created) as
# .github/workflows/update-moltenrock-trade.yml. Then: Actions → "Update MoltenRock Trade" → Run workflow.
# It opens a pull request with the newest version; merge it and Cloudflare deploys it. The database
# updates itself on the first request after the deploy. Your wrangler.toml (with your database id)
# is never touched. Also runs every Monday and only opens a pull request when there is something new.
#
# Needs: Settings → Actions → General → Workflow permissions → "Allow GitHub Actions to create and
# approve pull requests".
name: Update MoltenRock Trade

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository != 'Goldcote/moltenrock-trade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the newest version
        run: |
          git remote add upstream https://github.com/Goldcote/moltenrock-trade.git
          git fetch --depth=1 upstream main

      - name: Apply it on a branch (keeps your wrangler.toml)
        id: apply
        run: |
          VERSION=$(git show upstream/main:src/version.ts | sed -n "s/.*VERSION = '\(.*\)'.*/\1/p")
          BRANCH="update/moltenrock-trade-$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git switch -c "$BRANCH"
          git checkout upstream/main -- . ':(exclude)wrangler.toml'
          if git diff --cached --quiet; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name="MoltenRock Trade update" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update MoltenRock Trade to $VERSION"
          git push origin "$BRANCH"

      - name: Open a pull request
        if: steps.apply.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --head "${{ steps.apply.outputs.branch }}" \
            --title "Update MoltenRock Trade to ${{ steps.apply.outputs.version }}" \
            --body "New version from github.com/Goldcote/moltenrock-trade. Read CHANGELOG.md, then merge: Cloudflare deploys it and the database updates itself on the first request. Your wrangler.toml is unchanged; if a new version ever needs a change there, the changelog says so."
